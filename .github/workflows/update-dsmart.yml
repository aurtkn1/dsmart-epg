name: Update D-Smart EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-dsmart-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: D-Smart EPG oluştur
        run: |
          node generate_dsmart_epg.js

      - name: EPG kontrolü
        run: |
          test -f dsmart.xml
          echo "dsmart.xml oluşturuldu."
          wc -c dsmart.xml

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dsmart.xml

          if git diff --cached --quiet; then
            echo "EPG değişmemiş."
            exit 0
          fi

          git commit -m "Update D-Smart EPG"

          git pull --rebase origin main

          git push origin HEAD:main
